services:
  - type: web
    name: sentinelai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: VICTIM_APP_URL
        value: inline
      - key: HEALTH_WATCHER_ENABLED
        value: "false"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_PATH
        value: data/sentinelai.db
      - key: WORKSPACE_ROOT
        value: data/workspaces

